<!DOCTYPE html>
<html lang="en" data-app="jotlift" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jotlift dashboard</title>
<meta name="description" content="Your whole workout log in a browser. History, progress charts and personal bests, your exercises and routines, and export to a spreadsheet.">
<link rel="canonical" href="https://jotlift.app/dashboard/">
<meta property="og:title" content="Jotlift dashboard">
<meta property="og:description" content="Your whole workout log in a browser. History, progress charts and personal bests, your exercises and routines, and export to a spreadsheet.">
<meta property="og:url" content="https://jotlift.app/dashboard/">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/img/glyph.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  /* Applied before first paint so a light-mode reader never sees a dark flash. */
  try {
    var t = localStorage.getItem('jotlift.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body class="jotx">
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header__inner">
    <a class="wordmark" href="/">
      <svg width="24" height="24" viewBox="0 0 100 100" fill="none" aria-hidden="true"><g transform="translate(10,10) scale(0.8)"><path d="M67 26 L67 58 C67 73 56 81 46 81 C36 81 30 74 30 66" fill="none" stroke="var(--color-accent)" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
      <span class="wordmark__text">Jot<span>lift</span></span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Home</a>
      <a href="/how-it-works/">How it works</a>
      <a href="/pricing/">Pricing</a>
      <a href="/support/">Support</a>
      <a href="/dashboard/" aria-current="page">Dashboard</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch appearance">
      <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </div>
</header>

<main id="main" data-dash-root>
  <noscript>
    <section class="shell-prose prose" style="padding-top:56px">
      <h1 class="display h-page">Your log</h1>
      <p>The dashboard reads the log your phone has backed up, which needs JavaScript. Turn it on for jotlift.app and reload. Everything else on this site works without it.</p>
      <p><a href="/support/">Get in touch</a> if that is a problem for you.</p>
    </section>
  </noscript>

  <!-- The first paint, replaced as soon as the session is known. Row
       placeholders shaped like the content: no spinner, no fake progress. -->
  <section class="shell-dash" style="padding:48px 24px 96px" data-dash-boot>
    <div class="skeleton__line"></div>
    <div class="skeleton__title"></div>
    <div class="skeleton__rows">
      <div class="skeleton__row"></div>
      <div class="skeleton__row"></div>
      <div class="skeleton__row"></div>
      <div class="skeleton__row"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <p>Jotlift, ABN 55 482 265 411</p>
    <nav aria-label="Footer">
      <a href="/how-it-works/">How it works</a>
      <a href="/pricing/">Pricing</a>
      <a href="/support/">Support</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
      <a href="/delete/">Delete account</a>
    </nav>
  </div>
</footer>

<script type="module" src="/assets/js/dashboard/index.js"></script>
</body>
</html>
